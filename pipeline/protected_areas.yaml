# Protected areas whose boundary is written into the law as coordinates. `bantay` draws them on
# the site maps and sliders, and measures mine footprints and clearing against them.
#
# Coordinates are copied exactly as printed. Where the printed text is plainly a typo, the fix
# is listed under `corrections` with the reason. Each rebuilt boundary is checked against the
# area the law states, and against the government's own polygon where one is published.

nsmnp:
  name: Northern Sierra Madre Natural Park
  short: NSMNP
  law: RA 9125
  url: https://lawphil.net/statutes/repacts/ra2001/ra_9125_2001.html
  # Section 5: "Buffer zones of not more than one (1) kilometer wide from the boundaries of the
  # NSMNP, except those bordering the Province of Cagayan, are hereby established." Section 21(h)
  # prohibits mineral exploration, extraction and quarrying "within the NSMNP or its buffer zones".
  buffer_km: 1
  # Section 4: 287,861 ha of land plus 71,625 ha of coastline water = 359,486 ha.
  stated_area_ha: 359486
  # The printed coordinates are on the Luzon 1911 datum (EPSG:4253), not WGS84: read that way, the
  # rebuilt boundary matches the Biodiversity Management Bureau's polygon (Geoportal Philippines
  # layer geoportal:bmb_protectedareas, "Northern Sierra Madre Natural Park", 356,969 ha, legal
  # basis "Republic Act 9125 s. 2001 / Proc. 978 s. 1997") to within 36 m. Read as WGS84 it is off
  # by up to 240 m. The same two corrections below are in the BMB polygon. Proclamation No. 978
  # (1997), which RA 9125 replaced, prints the same two typos.
  datum: 4253
  corrections:
    15:
      longitude: "121-59-31"
      reason: >-
        Printed as 122-59'31", about 105 km east of points 14 and 16 (122-02'21" and 121-59'21"),
        which makes the boundary cross itself. 121-59'31" continues the line between them.
    41:
      latitude: "16-51-28"
      reason: >-
        Printed as 16-21'28", about 55 km south of points 40 and 42 (16-52'49" and 16-49'05").
        16-51'28" lies between them.
  corners:
    # point: [longitude, latitude] as printed in Section 4 (degrees-minutes-seconds)
    - [1, "122-11-23", "17-32-23"]
    - [2, "122-11-15", "17-31-16"]
