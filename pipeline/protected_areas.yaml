# ---- Areas whose law gives no coordinates: BMB polygons (cached in protected_areas/) ----
# Fetched from the Biodiversity Management Bureau's NIPAS layer on Geoportal Philippines (see
# bantay/protected.py). Left out on purpose: Proclamation 1636 (1977) national park and wildlife
# sanctuary in Rizal, whose BMB polygon (115,448 ha) does not match the 46,310 ha the proclamation
# states; and the Angat Watershed Reservation of Proclamation 71 (1927), which BMB marks
# "For Verification" (54,574 ha against 62,309 ha in the proclamation); and Biak-na-Bato National
# Park, whose BMB polygon (2,112 ha) follows the 1937 Proclamation 223 extent although Proclamation
# 401 (1989) redefined the park as 658.85 ha, and whose BMB records conflict (2,117 ha "for
# disestablishment" in TB 2013-01; 3,030.56 ha in PAIS).

pamitinan:
  name: Pamitinan Protected Landscape
  short: Pamitinan PL
  law: Proc. 901 (1996); RA 11038
  url: https://lawphil.net/executive/proc/proc1996/proc_901_1996.html
  stated_area_ha: 609.15 # RA 11038
  bmb: { paname: Pamitinan Protected Landscape, point: [121.19, 14.74] }

