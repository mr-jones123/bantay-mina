# Analysis areas processed by `uv run python -m bantay build <slug>`.
#
# Rules every comparison follows (see site/src/pages/methods.astro):
# - both images cover the same box on the same grid;
# - both use the same months of the year, chosen per site from the 2019-2025 Sentinel-2
#   cloud record (share of the box with >= 3 clear views in the cloudiest year), so
#   seasonal green-up is not mistaken for damage. Luzon and Semirara: January-May (the
#   dry season). Caraga (Surigao, Dinagat): April-September. Toledo, Cebu: March-August.
# - both use the same true-colour stretch; no per-image colour boosting.

defaults:
  box_km: 6            # square analysis box, centred on `center`
  pixel_m: 10          # output grid; Landsat (30 m) is resampled for display
  months: [1, 5]       # inclusive month range for every composite; sites may override
  max_scene_cloud: 60  # skip scenes whose whole-scene cloud cover is above this (%)
  stretch: [0.0, 0.22] # surface reflectance mapped to black..white
  gamma: 1.4

sites:
  didipio:
    name: Didipio mine
    center: [121.4503, 16.3247] # lon, lat — 16°19′29″N 121°27′01″E
    comparisons:
      - id: landsat-2005-2026
        title: Before construction (2005–07) vs. 2026
        sensor: landsat
        # Landsat 5 only: Landsat 7 images after 2003 have scan-line gaps.
        before: { platforms: [landsat-5], years: [2005, 2006, 2007] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Sharper view, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80 # few Sentinel-2 dry-season scenes before 2019; per-pixel masking does the rest
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  # Centres below are the middle of the Tang & Werner 2023 footprint cluster for each mine.

  padcal:
    name: Philex Padcal mine
    center: [120.6515, 16.2562] # Tuba / Itogon, Benguet
    box_km: 9 # tailings ponds spread ~7.6 × 5.2 km
    comparisons:
      - id: landsat-1988-2026
        title: Operating mine, 1988–90 vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  lepanto:
    name: Lepanto mine
    center: [120.7786, 16.876] # Mankayan, Benguet
    box_km: 7
    comparisons:
      - id: landsat-1988-2026
        title: Operating mine, 1988–90 vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  runruno:
    name: Runruno gold mine
    center: [121.3246, 16.4046] # Quezon, Nueva Vizcaya
    box_km: 5
    comparisons:
      - id: landsat-2006-2026
        title: Before mine construction (2006–09) vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [2006, 2007, 2008, 2009] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Early operations, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  dinapigue:
    name: Dinapigue nickel mine
    # Dinapigue, Isabela (Sierra Madre, Pacific coast). Box reaches north past the Northern Sierra
    # Madre Natural Park boundary (RA 9125, about 16.648 N here) so it shows next to the mine.
    center: [122.3085, 16.622]
    box_km: 9
    comparisons:
      - id: landsat-2003-2026
        title: Before mine development (2003–06) vs. 2026
        sensor: landsat
        # MPSA signed July 2007; causeway, haul road and pier reported in place by Sept 2008.
        before: { platforms: [landsat-5], years: [2003, 2004, 2005, 2006] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Sharper view, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  zambales-nickel:
    name: Santa Cruz–Candelaria nickel mines
    center: [120.0185, 15.7374] # Santa Cruz / Candelaria, Zambales
    box_km: 15 # ~9 × 14 km of mapped mine features
    pixel_m: 20 # keeps the 15 km box at 750 px
    comparisons:
      - id: landsat-2002-2026
        title: Before the nickel expansion (2002–05) vs. 2026
        sensor: landsat
        # Residents date mining's arrival to 2006; Benguet Corp. began its Santa Cruz nickel project in 2007.
        before: { platforms: [landsat-5], years: [2002, 2003, 2004, 2005] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Suspension years (2016–18) vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  # Centre from PCIJ's EIS-based location of dredging Segment 7 (beside Toran) and the Dodan site
  # raided by the NBI in 2012; about ±1–2 km. The box covers the corridor, not a permit polygon.
  cagayan-black-sand:
    name: Cagayan River mouth, Aparri
    center: [121.66, 18.34]
    box_km: 10
    comparisons:
      - id: sentinel2-2020-2024
        title: Before the river dredging (2020) vs. 2024
        sensor: sentinel-2
        # DENR agreement Dec 2020; dredging reported from Q1 2021; stopped in 2023.
        before: { years: [2020] }
        after: { years: [2024] }
      - id: landsat-2009-2014
        title: Around the 2012 Dodan raid, 2009–11 vs. 2013–14
        sensor: landsat
        before: { platforms: [landsat-5], years: [2009, 2010, 2011] }
        after: { platforms: [landsat-8], years: [2013, 2014] }

  # Centre from Metals Exploration's map of Woggle's Keon target (UTM 51N ≈ 305,800 E, 1,798,600 N),
  # ~100–200 m precision. Exploration only: little or no change is an expected result.
  kasibu-dupax-exploration:
    name: Woggle Keon exploration target, Dupax del Norte
    center: [121.1828, 16.2604]
    box_km: 4
    comparisons:
      - id: sentinel2-2024-2026
        title: Before exploration drilling (2024) vs. 2026
        sensor: sentinel-2
        # Mapping June 2025, access track and drill pads by Aug 2025, drilling Q4 2025, MGB suspension Feb 2026.
        before: { years: [2024] }
        after: { years: [2026] }

  barlo:
    name: Barlo mine (abandoned)
    center: [119.9548, 15.9722] # Barangay Barlo, Mabini, Pangasinan; Tang & Werner cluster centre
    box_km: 7
    comparisons:
      - id: landsat-1988-2026
        title: Four years after closure (1988–90) vs. 2026
        sensor: landsat
        # Acoje mined here 1974–1984; nothing on the site is "before mining".
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  itogon:
    name: Itogon gold mining district
    # Covers Antamok, Acupan–Balatoc, the Sangilo claim envelope and the 2018 First Gate (Ucab) landslide.
    center: [120.660, 16.367]
    box_km: 11
    comparisons:
      - id: landsat-1988-2026
        title: Late large-mine era (1988–90) vs. 2026
        sensor: landsat
        # Mining here since 1906; Antamok open pit ran ~1992–1998.
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Before Typhoon Ompong (2016–18) vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        # Jan–May scenes only, so every "before" view predates the September 2018 landslide.
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  # ---- Southern Sierra Madre foothills: limestone and aggregate quarries (Bulacan, Rizal) ----
  # Not in Tang & Werner; centres from the 2026 Sentinel-2 view and MGB/EMB permit locations.

  norzagaray:
    name: Norzagaray limestone quarries
    # Republic Cement (MPSA 026-94-III, Minuyan, ~14.888 N) and Helix/Holcim (MPSA 140-99-III,
    # Matictic-Bangkal, ~14.925 N), Norzagaray, Bulacan.
    center: [121.085, 14.905]
    box_km: 9
    comparisons:
      - id: landsat-1988-2026
        title: Earliest Landsat view (1988–90) vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  akle-talbak:
    name: Eagle Cement limestone quarries
    # Eagle Cement Corp. MPSA 181-2002-III (Akle, San Ildefonso) and MPSA 245-2007-III (Talbak,
    # Dona Remedios Trinidad; EIS quarry polygon centred ~15.062 N 121.070 E), Bulacan. Box reaches
    # north to the southern edge of Biak-na-Bato National Park (~15.101 N).
    center: [121.074, 15.078]
    box_km: 8
    comparisons:
      - id: landsat-1988-2026
        # Eagle's EPRMP: no activity for years after the 1998 ECC; Line 1 normal operation July 2010.
        title: Before the Eagle Cement project (1988–90) vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  # Rodriguez, Rizal is split in two: between the quarry clusters lies the town's housing growth,
  # which would otherwise dominate the vegetation -> bare figure.
  rodriguez-macabud:
    name: Macabud aggregate quarries
    # ATN Holdings, MPSA 354-2024-IVA (EIS rectangle 14.7833-14.7917 N, 121.1333-121.1417 E), and
    # neighbouring quarries in Macabud, Rodriguez, Rizal.
    center: [121.152, 14.787]
    box_km: 5
    comparisons:
      - id: landsat-1988-2026
        title: Before the quarries (1988–90) vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Before ATN's quarry start (2016–17) vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        # ATN told the PSE on 13 July 2018 that quarry operations had started; Jan-May 2018 is
        # left out so the "before" is clearly earlier.
        before: { years: [2016, 2017] }
        after: { years: [2026] }

  rodriguez-san-rafael:
    name: San Rafael quarries and Upper Wawa Dam
    # Montalban Millex (MPSA 239-2007-IVA, ~14.717 N 121.158 E) and San Rafael Development /
    # Majestic Earth Core (MPSA 136-99-IV, ~14.714 N 121.177 E) in San Rafael, Rodriguez; the Upper
    # Wawa Dam's construction quarry (EIS point 14.701 N 121.201 E); Pamitinan Protected Landscape.
    center: [121.183, 14.705]
    box_km: 8
    comparisons:
      - id: landsat-1988-2026
        title: Before the quarries (1988–90) vs. 2026
        sensor: landsat
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Before Upper Wawa Dam construction (2016–18) vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        # MWSS: Phase 2 construction began 28 June 2021.
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  # ---- Visayas and Mindanao ----

  semirara:
    name: Semirara coal mine
    # Semirara Island, Caluya, Antique. Unong pit 12.051 N; Molave-Narra 12.116 N.
    center: [121.384, 12.09]
    box_km: 12
    comparisons:
      - id: landsat-1988-2026
        title: Unong pit era (1988–90) vs. 2026
        sensor: landsat
        # Unong produced coal 1983-2000, so 1988 is already mining; Panian opened 1999, Narra/Molave 2013-16.
        before: { platforms: [landsat-5], years: [1988, 1989, 1990] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  surigao-nonoc:
    name: Nonoc and Hinatuan Island nickel mines
    # Nonoc Island (PNPI, former Nonoc refinery 9.832 N 125.609 E) and Hinatuan Mining Corp's Tagana-an
    # mine on Hinatuan Island (EMB envelope 9.753-9.813 N, 125.696-125.741 E).
    center: [125.672, 9.815]
    box_km: 16
    months: [4, 9] # Caraga has no dry season; April-September is clearest (see methods)
    comparisons:
      - id: landsat-1994-2026
        title: Between Nonoc's closure and restart (1994–2002) vs. 2026
        sensor: landsat
        # Nonoc mined 1974-1986, restarted 2003 and 2010; Tagana-an mined since 1980. The Landsat
        # archive has no scenes here before 1994, and few after, so the "before" spans nine years.
        max_scene_cloud: 80
        before: { platforms: [landsat-5, landsat-7], years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  claver:
    name: Claver nickel mines
    # Taganito (TMC) and the Taganito HPAL plant, Cagdianao (PGMC, CMDC/Shenzhou) and Urbiztondo (Adnama),
    # Claver, Surigao del Norte. Box reaches Urbiztondo in the west and the polygons at 125.91 E.
    center: [125.839, 9.51]
    box_km: 16
    months: [4, 9]
    comparisons:
      - id: landsat-1994-2026
        title: Before the nickel boom (1994–2002) vs. 2026
        sensor: landsat
        # TMC mined Taganito from 1987, so this is not "before mining". PGMC began 2006, Adnama 2007-11,
        # CMDC by 2010, HPAL construction 2010. No Landsat scenes here before 1994.
        max_scene_cloud: 80
        before: { platforms: [landsat-5, landsat-7], years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  toledo:
    name: Toledo copper mine
    # Carmen pit (MPSA 210, 10.321-10.347 N), Lutopan pit, Biga pit / tailings storage, Malubog reservoir
    # (10.362 N). The 10.20 N cluster in Tang & Werner is the Naga cement/quarry area, left out.
    center: [123.73, 10.33]
    box_km: 12
    months: [3, 8] # Cebu uplands: March-August is clearest (see methods)
    comparisons:
      - id: landsat-1992-2026
        title: Earlier mining era (1992–95) vs. 2026
        sensor: landsat
        # Lutopan mined from 1955, Biga 1963, Carmen 1977; present Carmen phase first ore June 2012.
        # Only 2 usable March-August scenes in 1988, so the window starts in 1992.
        before: { platforms: [landsat-5], years: [1992, 1993, 1994, 1995] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  carrascal:
    name: Carrascal nickel mines
    # Carrascal Nickel Corp (operator for CTP; centre ~9.376 N 125.907 E), CTP Adlay and Dahican,
    # Carrascal, Surigao del Sur. Marcventures (Cantilan, 9.23-9.33 N) is south of the box.
    center: [125.895, 9.39]
    box_km: 14
    months: [4, 9]
    comparisons:
      - id: landsat-1994-2026
        title: Before large-scale nickel mining (1994–2002) vs. 2026
        sensor: landsat
        # CTP Adlay began Sept 2006, CNC 2009, Dahican 2011. No Landsat scenes here before 1994.
        max_scene_cloud: 80
        before: { platforms: [landsat-5, landsat-7], years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002] }
        after: { platforms: [landsat-8, landsat-9], years: [2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  dinagat-loreto:
    name: Loreto nickel and chromite mines, Dinagat
    # Sinosteel, Century Peak (Panamaon), Oriental Synergy, Comet/Esperanza and the Krominco block
    # at the south edge; mine polygons reach 10.47 N.
    center: [125.648, 10.414]
    box_km: 13
    months: [4, 9]
    comparisons:
      - id: landsat-1994-2026
        title: Before large-scale mining (1994–2002) vs. 2024–26
        sensor: landsat
        # Earliest verified project development is 2008. Landsat has no scenes here before 1994.
        # Dinagat is cloudier: every scene is allowed (per-pixel masking does the rest) and the
        # "after" uses three seasons; with one or two, missed cloud in the south of the box was
        # counted as new bare ground.
        max_scene_cloud: 100
        before: { platforms: [landsat-5, landsat-7], years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002] }
        after: { platforms: [landsat-8, landsat-9], years: [2024, 2025, 2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }

  dinagat-tubajon:
    name: Malinao ridge mines, Tubajon, Dinagat
    # Oriental Vision/Palhi and SR Metals-Vista Buena at Malinao (10.257 N 125.618 E); Libjo Mining's
    # agreement reaches the box from the west.
    center: [125.64, 10.255]
    box_km: 9
    months: [4, 9]
    comparisons:
      - id: landsat-1994-2026
        title: Before large-scale mining (1994–2002) vs. 2025–26
        sensor: landsat
        # Oriental Vision shipping by 2010, Libjo from 2014, Vista Buena production 2015.
        max_scene_cloud: 100 # see dinagat-loreto
        before: { platforms: [landsat-5, landsat-7], years: [1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002] }
        after: { platforms: [landsat-8, landsat-9], years: [2025, 2026] }
      - id: sentinel2-2016-2026
        title: Recent change, 2016–18 vs. 2026
        sensor: sentinel-2
        max_scene_cloud: 80
        before: { years: [2016, 2017, 2018] }
        after: { years: [2026] }
