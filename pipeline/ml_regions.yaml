# Regions for the mining classifier (`uv run python -m bantay.ml ...`).
#
# Centres are Tang & Werner 2023 mine-cluster centres. Boxes are wider than the mines so each
# region also supplies look-alikes: farms, towns, riverbeds, grassland, landslides.
#
# `test` regions are Northern Luzon and are NEVER used for training or threshold tuning. This is
# the honest check: can a model trained on Mindanao, the Visayas, Palawan and southern Luzon find
# the mines of Northern Luzon?

defaults:
  pixel_m: 20 # Sentinel-2 B11/B12 are native 20 m
  months: [1, 5] # dry season, same as the website imagery
  max_scene_cloud: 60

train:
  caraga-claver: { center: [125.866, 9.407], box_km: 24 } # Surigao del Sur/Norte nickel
  surigao-nonoc: { center: [125.667, 9.817], box_km: 16 } # Surigao City / Nonoc nickel
  dinagat: { center: [125.646, 10.346], box_km: 20 } # Dinagat Islands nickel
  toledo: { center: [123.734, 10.273], box_km: 20 } # Cebu copper
  rio-tuba: { center: [117.42, 8.553], box_km: 16 } # Palawan nickel
  aroroy: { center: [123.398, 12.459], box_km: 12 } # Masbate gold
  semirara: { center: [121.384, 12.107], box_km: 12 } # Antique coal
  marinduque: { center: [121.977, 13.437], box_km: 12 } # legacy copper
  sipalay: { center: [122.444, 9.806], box_km: 12 } # Negros copper
  san-marcelino: { center: [120.328, 14.968], box_km: 10 } # Zambales legacy copper

test:
  zambales-nickel: { center: [120.0185, 15.7374], box_km: 20 }
  benguet: { center: [120.655, 16.31], box_km: 20 } # Padcal, Itogon, Baguio
  didipio-runruno: { center: [121.385, 16.365], box_km: 18 }
  lepanto: { center: [120.779, 16.876], box_km: 12 }
  dinapigue: { center: [122.3085, 16.611], box_km: 12 }
